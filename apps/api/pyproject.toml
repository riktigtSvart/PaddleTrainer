[project]
name = "paddle-coach-api"
version = "0.1.0"
description = "Training planning MVP with Polar AccessLink v4 integration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "cryptography>=43,<46",
  "itsdangerous>=2.2,<3.0",
  "python-multipart>=0.0.9,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0"
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]