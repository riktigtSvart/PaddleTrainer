services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paddle
      POSTGRES_USER: paddle
      POSTGRES_PASSWORD: paddle
    ports:
      - "5433:5432"
    volumes:
      - paddle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paddle -d paddle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paddle_pgdata:
